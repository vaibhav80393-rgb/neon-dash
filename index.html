<title>Neon Dash</title>
<style>
body{margin:0;background:#090b11;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.wrap{width:min(720px,96vw)} h1{text-align:center;margin:8px 0;font-size:24px}
.hud{display:flex;justify-content:space-between;background:#151a25;padding:10px;border-radius:10px 10px 0 0;font-weight:bold}
canvas{display:block;width:100%;background:#11151f;border:1px solid #2a3345;box-sizing:border-box}
.controls{display:flex;gap:8px;padding:10px;background:#151a25;border-radius:0 0 10px 10px}
button{flex:1;padding:12px;border:0;border-radius:8px;background:#283247;color:white;font-weight:bold;cursor:pointer}
#status{text-align:center;color:#b9c4d8;font-size:13px;padding:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>NEON DASH</h1>
<div class="hud"><span id="level">Level 1</span><span id="score">Score: 0</span><span id="coins">Coins: 0</span></div>
<canvas id="game" width="720" height="360"></canvas>
<div class="controls"><button id="jump">JUMP</button><button id="restart">RESTART</button><button id="next">NEXT LEVEL</button></div>
<div id="status">Space / ↑ / W / click to jump. Avoid spikes and collect coins.</div>
</div>
<script>
const c=document.getElementById("game"),x=c.getContext("2d"),W=720,H=360,G=292;
let level=0,score=0,coins=0,scroll=0,running=true,dead=false,won=false,last=0;
const p={x:110,y:G-30,w:30,h:30,vy:0,on:true};
const maps=[
{speed:235,a:[[390,"s"],[540,"s"],[690,"c"],[820,"s2"],[1010,"s"],[1150,"c"],[1290,"s"],[1430,"s2"],[1600,"c"],[1740,"s"]]},
{speed:255,a:[[350,"s"],[470,"s2"],[620,"c"],[760,"s"],[900,"s2"],[1080,"c"],[1210,"s"],[1350,"s"],[1490,"c"],[1640,"s2"],[1810,"s"]]},
{speed:275,a:[[330,"s2"],[450,"c"],[570,"s"],[710,"s2"],[850,"s"],[990,"c"],[1130,"s2"],[1280,"s"],[1410,"c"],[1560,"s2"],[1720,"s"],[1880,"s2"]]}
];
function reset(){scroll=0;running=true;dead=false;won=false;p.y=G-p.h;p.vy=0;p.on=true;maps[level].a.forEach(i=>i.used=false);msg("Space / ↑ / W / click to jump. Avoid spikes and collect coins.");hud()}
function hud(){document.getElementById("level").textContent="Level "+(level+1);document.getElementById("score").textContent="Score: "+Math.floor(score);document.getElementById("coins").textContent="Coins: "+coins}
function msg(t){document.getElementById("status").textContent=t}
function jump(){if(running&&p.on){p.vy=-525;p.on=false}}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function die(){dead=true;running=false;msg("CRASH! Press RESTART or Space.")}
function update(dt){
 if(!running)return;
 scroll+=maps[level].speed*dt; score+=maps[level].speed*dt/10;
 p.vy+=1250*dt;p.y+=p.vy*dt;
 if(p.y+p.h>=G){p.y=G-p.h;p.vy=0;p.on=true}
 for(const it of maps[level].a){
  let q=it[0]-scroll;
  if(it.used||q<-60||q>W+60)continue;
  if(it[1]=="c"){
   if(hit(p,{x:q,y:G-63,w:26,h:26})){it.used=true;coins++;score+=100}
  }else{
   let w=it[1]=="s2"?52:28,h=it[1]=="s2"?42:32;
   if(hit(p,{x:q+3,y:G-h,w:w-6,h:h})){die();break}
  }
 }
 if(scroll>maps[level].a[maps[level].a.length-1][0]+300){won=true;running=false;msg("LEVEL COMPLETE! Press NEXT LEVEL.")}
 hud()
}
function draw(){
 x.clearRect(0,0,W,H);
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#171d30");g.addColorStop(1,"#090b11");x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle="#273147";for(let i=-(scroll%40);i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
 x.fillStyle="#171d29";x.fillRect(0,G,W,H-G);x.fillStyle="#5ee7ff";x.fillRect(0,G,W,4);
 for(const it of maps[level].a){let q=it[0]-scroll;if(q<-60||q>W+60)continue;
  if(it[1]=="c"){x.beginPath();x.arc(q+13,G-52,11,0,Math.PI*2);x.fillStyle="#ffd84d";x.fill();x.strokeStyle="#fff";x.stroke()}
  else{x.beginPath();let w=it[1]=="s2"?52:28;x.moveTo(q,G);x.lineTo(q+w/2,G-(it[1]=="s2"?42:32));x.lineTo(q+w,G);x.closePath();x.fillStyle="#ff4d78";x.fill()}
 }
 x.fillStyle="#7cf7ff";x.fillRect(p.x,p.y,p.w,p.h);x.strokeStyle="#fff";x.strokeRect(p.x,p.y,p.w,p.h);
 x.fillStyle="#111827";x.fillRect(p.x+7,p.y+7,5,5);x.fillRect(p.x+18,p.y+7,5,5);
 if(dead||won){x.fillStyle="rgba(0,0,0,.6)";x.fillRect(0,0,W,H);x.textAlign="center";x.fillStyle="#fff";x.font="bold 34px Arial";x.fillText(won?"LEVEL COMPLETE!":"CRASH!",W/2,150);x.font="bold 18px Arial";x.fillText(won?"Press NEXT LEVEL":"Press RESTART",W/2,185);x.textAlign="left"}
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
document.getElementById("jump").onclick=jump;
document.getElementById("restart").onclick=()=>{if(dead||won){reset()}else{level=0;score=0;coins=0;reset()}};
document.getElementById("next").onclick=()=>{if(won){if(level<maps.length-1){level++;reset()}else{msg("ALL 3 LEVELS COMPLETE! Press RESTART to play again.");won=false;running=false}}};
c.onclick=jump;
document.addEventListener("keydown",e=>{if(["Space","ArrowUp","KeyW"].includes(e.code)){e.preventDefault();dead?reset():jump()}if(e.code=="KeyR"){level=0;score=0;coins=0;reset()}});
reset();requestAnimationFrame(loop);
</script>
</body>
