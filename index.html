function reset(){scroll=0;running=true;dead=false;won=false;p.y=G-p.h;p.vy=0;p.on=true;maps[level].a.forEach(i=>i.used=false);msg("EASY MODE: Space / ↑ / W / click to jump. Take your time!");hud()}
function hud(){document.getElementById("level").textContent="Level "+(level+1)+" / 50";document.getElementById("score").textContent="Score: "+Math.floor(score);document.getElementById("coins").textContent="Coins: "+coins}
function msg(t){document.getElementById("status").textContent=t}
function jump(){if(running&&p.on){p.vy=-575;p.on=false}}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function die(){dead=true;running=false;msg("CRASH! Press RESTART or Space.")}
function update(dt){
 if(!running)return;
 scroll+=maps[level].speed*dt; score+=maps[level].speed*dt/10;
 p.vy+=1050*dt;p.y+=p.vy*dt;
 if(p.y+p.h>=G){p.y=G-p.h;p.vy=0;p.on=true}
 for(const it of maps[level].a){
  let q=it[0]-scroll;
  if(it.used||q<-60||q>W+60)continue;
  if(it[1]=="c"){
   if(hit(p,{x:q,y:G-63,w:26,h:26})){it.used=true;coins++;score+=100}
  }else{
   let w=it[1]=="s2"?46:24,h=it[1]=="s2"?35:27;
   if(hit(p,{x:q+3,y:G-h,w:w-6,h:h})){die();break}
  }
 }
 if(scroll>maps[level].a[maps[level].a.length-1][0]+300){won=true;running=false;msg("LEVEL COMPLETE! Press NEXT LEVEL.")}
 hud()
}
function draw(){
 x.clearRect(0,0,W,H);
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#171d30");g.addColorStop(1,"#090b11");x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle="#273147";for(let i=-(scroll%40);i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
 x.fillStyle="#171d29";x.fillRect(0,G,W,H-G);x.fillStyle="#5ee7ff";x.fillRect(0,G,W,4);
 for(const it of maps[level].a){let q=it[0]-scroll;if(q<-60||q>W+60)continue;
  if(it[1]=="c"){x.beginPath();x.arc(q+13,G-52,11,0,Math.PI*2);x.fillStyle="#ffd84d";x.fill();x.strokeStyle="#fff";x.stroke()}
  else{x.beginPath();let w=it[1]=="s2"?52:28;x.moveTo(q,G);x.lineTo(q+w/2,G-(it[1]=="s2"?42:32));x.lineTo(q+w,G);x.closePath();x.fillStyle="#ff4d78";x.fill()}
 }
 x.fillStyle="#7cf7ff";x.fillRect(p.x,p.y,p.w,p.h);x.strokeStyle="#fff";x.strokeRect(p.x,p.y,p.w,p.h);
 x.fillStyle="#111827";x.fillRect(p.x+7,p.y+7,5,5);x.fillRect(p.x+18,p.y+7,5,5);
 if(dead||won){x.fillStyle="rgba(0,0,0,.6)";x.fillRect(0,0,W,H);x.textAlign="center";x.fillStyle="#fff";x.font="bold 34px Arial";x.fillText(won?"LEVEL COMPLETE!":"CRASH!",W/2,150);x.font="bold 18px Arial";x.fillText(won?"Press NEXT LEVEL":"Press RESTART",W/2,185);x.textAlign="left"}
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
document.getElementById("jump").onclick=jump;
document.getElementById("restart").onclick=()=>{if(dead||won){reset()}else{level=0;score=0;coins=0;reset()}};
document.getElementById("next").onclick=()=>{if(won){if(level<maps.length-1){level++;reset()}else{msg("ALL 50 LEVELS COMPLETE! Press RESTART to play again.");won=false;running=false}}};
c.onclick=jump;
document.addEventListener("keydown",e=>{if(["Space","ArrowUp","KeyW"].includes(e.code)){e.preventDefault();dead?reset():jump()}if(e.code=="KeyR"){level=0;score=0;coins=0;reset()}});
reset();requestAnimationFrame(loop);
